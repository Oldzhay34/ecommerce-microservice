server {
    listen 6001;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Performans için GZIP sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    location / {
        # React (SPA) istemci tarafı yönlendirmesi için
        try_files $uri $uri/ /index.html;

        # Module Federation (remoteEntry.js) için CORS izinleri
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # remoteEntry.js cache'lenmemeli — aşağıdaki genel kurala göre önceliklidir (exact match).
    location = /assets/remoteEntry.js {
        add_header Cache-Control "no-cache" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Statik assetler için önbellekleme ve CORS
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        add_header 'Access-Control-Allow-Origin' '*' always;
    }
}