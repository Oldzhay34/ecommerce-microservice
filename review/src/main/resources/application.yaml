server:
  port: 8084

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:review_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    # Hibernate once tabloları oluşturur/günceller, SONRA güvenlik trigger'ları
    # yazılır (aksi halde trigger script'i henüz var olmayan tablolara başvururdu).
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/security-triggers.sql
      # security-triggers.sql $$ dolar-quote fonksiyon govdeleri icerir; varsayilan
      # tek ';' ayiricisi govde icindeki ';' karakterlerinde de bolerdi.
      separator: ";;"
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:EcommerceSecurePass2026!}
    template:
      exchange: review.exchange

jwt:
  secret: ${JWT_SECRET:EcommerceSharedJwtSecretKey2026VeryLongAndSecure32Bytes}