server {
    listen 5000;
    server_name localhost;

    # Vite'in content-hash'li derleme çıktıları (örn. index-abc123.js) — bir kez
    # yayınlandıktan sonra asla değişmez; agresif, uzun ömürlü cache CDN'lerin
    # (Cloudflare/CloudFront vb.) önden ekleneceği varsayımıyla burada kurulur.
    # Domain/CDN eklenene kadar bu origin zaten aynı davranışı sağlar.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        root /usr/share/nginx/html;
        add_header 'Cache-Control' 'public, max-age=31536000, immutable';
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        try_files $uri =404;
    }

    # index.html HER ZAMAN taze olmalı — aksi halde kullanıcılar yeni deploy'dan
    # sonra eski (hash'i artık var olmayan asset'lere işaret eden) bir kabuk görür.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header 'Cache-Control' 'no-cache, must-revalidate';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # React Router için SPA yönlendirmesi
        try_files $uri $uri/ /index.html;

        # Module Federation dosyalarının tarayıcıda engellenmemesi için CORS
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    }
}
