server {
    listen 6008;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Module Federation: host (5000) ve mfe-product-detail (6010) remoteEntry.js'i
    # cross-origin ceker. Vite'in cors: true ayari SADECE dev/preview server'inda calisir;
    # container'da nginx serve ettigi icin header BURADA eklenmek ZORUNDADIR.
    location /assets/ {
        # try_files $uri =404: asset yoksa 404 donsun, /index.html'e DUSMESIN.
        # SPA fallback'ine dusmek redirection cycle uretir.
        try_files $uri =404;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;

        # remoteEntry.js cache'lenmemeli: yeni build sonrasi host eski dosyayi okumasin.
        add_header 'Cache-Control' 'no-cache, no-store, must-revalidate' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location / {
        # DIKKAT: $uri ile $uri/ ARASINDA BOSLUK VAR.
        # '$uri$uri/' (bosluksuz) tek bir degisken birlesimi olarak okunur,
        # /index.html'e duser ve sonsuz redirection cycle -> 500 uretir.
        try_files $uri $uri/ /index.html;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
    }
}