server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # remoteEntry.js her zaman taze olmalı.
    location = /assets/remoteEntry.js {
        add_header 'Cache-Control' 'no-cache' always;
        try_files $uri =404;
    }

    # Content-hash'li diğer JS/CSS/asset'ler değişmez — CDN önden eklendiğinde
    # aynı davranışı bu origin zaten sağlar.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        add_header 'Cache-Control' 'public, max-age=31536000, immutable' always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header 'Cache-Control' 'no-cache, must-revalidate' always;
    }

    # SPA Yönlendirmesi (Shell için kritik)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
