name: Product Service CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'product/**'
      - '.github/workflows/product-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'product/**'

jobs:
  build:
    runs-on: ubuntu-latest

    # Tüm adımların bu klasör içinde çalışmasını sağlar
    defaults:
      run:
        working-directory: ./product

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Unit and Integration Tests
      run: mvn clean test