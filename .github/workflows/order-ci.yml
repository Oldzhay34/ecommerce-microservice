name: Order Service CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'order/**'
      - '.github/workflows/order-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'order/**'
      - '.github/workflows/order-ci.yml'

defaults:
  run:
    working-directory: order

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
        continue-on-error: true

      - name: Build and run tests (Maven)
        run: mvn -B clean verify
        # NOT: Testcontainers (Postgres, RabbitMQ, Elasticsearch) subsystem
        # testleri Docker gerektirir. ubuntu-latest runner'da Docker zaten
        # kurulu olduğu için ekstra bir servis tanımına gerek yoktur.

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-test-results
          path: order/target/surefire-reports/**/*.xml
          retention-days: 7

      - name: Upload build artifact (jar)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: order-service-jar
          path: order/target/*.jar
          retention-days: 7

  # İstersen Docker image build/push adımını da ekleyebiliriz - bunun için
  # registry bilgisi (ör. ghcr.io, Docker Hub) ve credentials secret adları
