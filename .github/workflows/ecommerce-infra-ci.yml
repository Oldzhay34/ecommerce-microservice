name: Ecommerce Infra CI

# ecommerce-infra sadece paylasilan altyapiyi (RabbitMQ, Elasticsearch, Redis,
# Prometheus, Grafana) tanimlayan bir compose dosyasidir; Java kodu icermez. Bu
# yuzden burada birim testi degil, compose dosyasinin gecerliligini ve stack'in
# gercekten saglikli ayaga kalktigini dogrulayan bir smoke testi kosuyoruz.
#
# Gozlemlenebilirlik katmani (prometheus/ + grafana/) icin ekstra olarak:
#   - prometheus.yml ve Grafana provisioning dosyalarinin sozdizimi,
#   - Prometheus'un config'i GERCEKTEN yukledigi ve rabbitmq_prometheus
#     plugin'ini gercekten scrape edebildigi,
#   - Grafana'nin datasource + dashboard provisioning'inin GERCEKTEN uygulandigi
# dogrulanir.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ecommerce-infra/**'
      - '.github/workflows/ecommerce-infra-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ecommerce-infra/**'
      - '.github/workflows/ecommerce-infra-ci.yml'

defaults:
  run:
    working-directory: ecommerce-infra

env:
  # compose.yml bu iki degiskeni .env dosyasindan bekler, ancak .env
  # .gitignore'da oldugu icin CI checkout'unda bulunmaz. Asagida CI'a ozel
  # gecici bir .env uretiyoruz; bunlar yalnizca tek kullanimlik test
  # kimlik bilgileridir, hicbir gercek ortamda kullanilmaz.
  RABBITMQ_USER: ci_user
  RABBITMQ_PASSWORD: ci_password
  GRAFANA_ADMIN_USER: ci_admin
  GRAFANA_ADMIN_PASSWORD: ci_admin_password
  COMPOSE_NETWORK: ecommerce-shared-network

jobs:
  validate-and-smoke:
    name: Validate compose & smoke test stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CI-only .env
        run: |
          cat > .env <<EOF
          RABBITMQ_USER=${RABBITMQ_USER}
          RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
          GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          EOF

      - name: Validate compose syntax
        # Degiskenler cozulemezse veya YAML bozuksa burada patlar.
        run: docker compose -f compose.yml config

      - name: Lint compose conventions
        # Her servisin healthcheck'i olmali (asagidaki "up --wait" buna dayaniyor)
        # ve hicbir imaj kaymaya acik :latest etiketi kullanmamali.
        run: |
          python3 - <<'PY'
          import subprocess, sys, yaml
          cfg = yaml.safe_load(subprocess.check_output(
              ["docker", "compose", "-f", "compose.yml", "config"], text=True))
          problems = []
          for name, svc in (cfg.get("services") or {}).items():
              if not svc.get("healthcheck"):
                  problems.append(f"{name}: healthcheck tanimli degil")
              image = svc.get("image", "")
              if ":" not in image.rsplit("/", 1)[-1] or image.endswith(":latest"):
                  problems.append(f"{name}: imaj sabit bir surume sabitlenmemis ({image!r})")
          if problems:
              print("Compose lint hatalari:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print(f"Compose lint OK ({len(cfg.get('services') or {})} servis)")
          PY

      - name: Validate observability config files
        # prometheus.yml'i Prometheus'un KENDI parser'i (promtool) ile dogrula; ayrica
        # Grafana provisioning dosyalari ve dashboard JSON'lari sozdizimsel olarak
        # gecerli olmali - bozuk bir dosya Grafana'yi calistirmadan once yakalanir.
        run: |
          set -e
          docker run --rm -v "$PWD/prometheus:/cfg:ro" \
            --entrypoint promtool prom/prometheus:v2.55.1 check config /cfg/prometheus.yml
          python3 - <<'PY'
          import json, pathlib, sys, yaml
          problems = []
          for path in sorted(pathlib.Path("grafana/provisioning").rglob("*")):
              if not path.is_file():
                  continue
              try:
                  if path.suffix in (".yml", ".yaml"):
                      yaml.safe_load(path.read_text(encoding="utf-8"))
                  elif path.suffix == ".json":
                      json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  problems.append(f"{path}: {exc}")
          if problems:
              print("Grafana provisioning hatalari:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("Grafana provisioning dosyalari gecerli")
          PY

      - name: Create external shared network
        # compose.yml agi "external: true" olarak tanimliyor, yani onceden
        # var olmasi gerekiyor; compose bunu kendisi olusturmaz.
        run: docker network create "${COMPOSE_NETWORK}" || true

      - name: Start stack and wait for healthy
        # --wait, her servisin healthcheck'i "healthy" olana kadar bekler.
        # Elasticsearch'un start_period'u 60s oldugu icin timeout genis tutuldu.
        run: docker compose -f compose.yml up -d --wait --wait-timeout 420

      - name: Smoke test - RabbitMQ
        run: |
          docker exec ecommerce-rabbitmq rabbitmq-diagnostics -q ping
          # Management API'nin de ayakta ve kimlik dogrulamasinin calistigini dogrula.
          curl -fsS -u "${RABBITMQ_USER}:${RABBITMQ_PASSWORD}" \
            http://localhost:15672/api/overview > /dev/null
          echo "RabbitMQ OK (amqp 5672 / management 15672)"

      - name: Smoke test - Elasticsearch
        run: |
          health=$(curl -fsS http://localhost:9200/_cluster/health)
          echo "$health"
          status=$(echo "$health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          if [ "$status" = "red" ]; then
            echo "Elasticsearch cluster durumu 'red'" >&2
            exit 1
          fi
          echo "Elasticsearch OK (status=$status)"

      - name: Smoke test - Redis
        run: |
          pong=$(docker exec ecommerce-redis redis-cli ping)
          [ "$pong" = "PONG" ] || { echo "Redis PING yanitlamadi: $pong" >&2; exit 1; }
          # Gercek bir yazma/okuma turu, salt ping'den daha anlamli.
          docker exec ecommerce-redis redis-cli set ci:smoke ok > /dev/null
          value=$(docker exec ecommerce-redis redis-cli get ci:smoke)
          [ "$value" = "ok" ] || { echo "Redis set/get basarisiz: $value" >&2; exit 1; }
          echo "Redis OK (ping + set/get)"

      - name: Smoke test - Prometheus
        run: |
          set -e
          curl -fsS http://localhost:9090/-/healthy > /dev/null
          curl -fsS http://localhost:9090/-/ready > /dev/null

          # Repodaki prometheus.yml'de tanimli her job, calisan Prometheus'ta
          # GERCEKTEN kayitli olmali (mount edilmemis/eski config'i yakalar).
          python3 - <<'PY'
          import json, sys, urllib.request, yaml
          expected = {j["job_name"] for j in yaml.safe_load(
              open("prometheus/prometheus.yml", encoding="utf-8"))["scrape_configs"]}
          with urllib.request.urlopen("http://localhost:9090/api/v1/targets") as r:
              data = json.load(r)["data"]
          actual = {t["labels"]["job"] for t in data["activeTargets"]}
          missing = expected - actual
          if missing:
              print(f"Prometheus'ta eksik job'lar: {sorted(missing)}")
              sys.exit(1)
          print(f"Prometheus {len(expected)} job'in tamamini yukledi: {sorted(expected)}")
          PY
          echo "Prometheus OK (9090)"

      - name: Smoke test - Prometheus gercekten scrape ediyor (rabbitmq + self)
        # Bu stack'te yalnizca rabbitmq ve prometheus ayakta; mikroservis hedefleri
        # dogal olarak DOWN olur. Bu yuzden sadece bu iki job'in UP olmasi beklenir -
        # bu, rabbitmq_prometheus plugin'inin ve scrape yolunun GERCEKTEN calistiginin
        # kanitidir.
        run: |
          set -e
          # Plugin'in metrik ucunu once dogrudan dogrula.
          curl -fsS -o /dev/null http://localhost:15692/metrics

          # PromQL ifadesi {, }, " ve | icerir; bunlar URL'de ham gonderilemez
          # (Prometheus 400 doner). -G + --data-urlencode ile curl'un kendisi encode eder.
          # Ayrica curl ciktisi once degiskene alinir: "curl | python3" boru hattinda
          # curl'un hata kodu kaybolur ve gercek hata JSON parse hatasi gibi gorunur.
          up=0
          for attempt in $(seq 1 30); do
            if body=$(curl -fsS -G http://localhost:9090/api/v1/query \
                        --data-urlencode 'query=up{job=~"rabbitmq|prometheus"}'); then
              up=$(printf '%s' "$body" \
                   | python3 -c 'import json,sys; print(sum(int(r["value"][1]) for r in json.load(sys.stdin)["data"]["result"]))')
              if [ "$up" = "2" ]; then
                echo "Prometheus scrape OK (rabbitmq + prometheus UP)"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "rabbitmq/prometheus hedefleri 150s icinde UP olmadi (up toplami=$up)" >&2
          curl -fsS http://localhost:9090/api/v1/targets | head -c 4000 >&2
          exit 1

      - name: Smoke test - Grafana
        run: |
          set -e
          auth="${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}"

          db=$(curl -fsS http://localhost:3300/api/health \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["database"])')
          [ "$db" = "ok" ] || { echo "Grafana database durumu: $db" >&2; exit 1; }

          # Provisioning GERCEKTEN uygulanmis mi: datasource + dashboard mevcut olmali.
          ds_uid=$(curl -fsS -u "$auth" http://localhost:3300/api/datasources/name/Prometheus \
                   | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["uid"])')
          # Dashboard provisioner dosyalari periyodik tarar; kisa bir tolerans birakilir.
          for attempt in $(seq 1 12); do
            if curl -fsS -u "$auth" http://localhost:3300/api/dashboards/uid/shopbridge-overview > /dev/null; then
              break
            fi
            [ "$attempt" = "12" ] && { echo "shopbridge-overview dashboard'i provision edilmedi" >&2; exit 1; }
            sleep 5
          done

          # Grafana -> Prometheus baglantisi gercekten kuruluyor mu (proxy uzerinden).
          curl -fsS -u "$auth" \
            "http://localhost:3300/api/datasources/proxy/uid/${ds_uid}/api/v1/query?query=up" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"]=="success"'
          echo "Grafana OK (3300; datasource + dashboard provision edildi, Prometheus'a proxy calisiyor)"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f compose.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: |
          docker compose -f compose.yml down -v --remove-orphans || true
          docker network rm "${COMPOSE_NETWORK}" || true
