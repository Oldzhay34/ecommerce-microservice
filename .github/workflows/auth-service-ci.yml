name: Auth Service CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      # Sadece auth-service klasörü içindeki kodlar veya bu workflow dosyası değiştiğinde tetiklenir
      - 'auth-service/**'
      - '.github/workflows/auth-service-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service-ci.yml'

jobs:
  test-and-build:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    # Monorepo yapısı olduğu için komutların doğrudan auth-service klasörü içinde çalışmasını sağlar
    defaults:
      run:
        working-directory: ./auth-service

    steps:
      - name: Kodu GitHub'dan Çek
        uses: actions/checkout@v4

      - name: Java JDK Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Kullandığın Java sürümüne göre (örn: 17 veya 21) ayarlayabilirsin
          distribution: 'temurin'
          cache: maven # Bağımlılıkları cache'leyerek sonraki build'leri hızlandırır

      - name: Maven Wrapper İzinlerini Düzenle
        run: chmod +x mvnw || true

      - name: Spring Boot Testlerini Çalıştır
        # activeProfile "test" ile test klasöründeki application-test.yml devreye girer
        run: ./mvnw test -Dspring.profiles.active=test