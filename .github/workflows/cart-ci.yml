name: Cart Service CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cart/**'
      - '.github/workflows/cart-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'cart/**'
      - '.github/workflows/cart-ci.yml'
  workflow_dispatch: # <-- BU SATIRI EKLEDİK (Manuel tetikleme için)

defaults:
  run:
    working-directory: cart

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
        continue-on-error: true

      - name: Build and run tests (Maven)
        run: mvn -B clean verify
        # Katmanlar:
        #   com.cart.unit.*        -> saf Mockito, altyapı gerektirmez
        #   com.cart.integration.* -> @WebMvcTest + gerçek Spring Security filtre zinciri
        #   com.cart.subsystem.*   -> Testcontainers (Postgres + RabbitMQ + Redis)
        #   com.cart.systemalpha.* -> tam stack black-box E2E (aynı container'lar)
        #
        # NOT: subsystem ve systemalpha katmanları Docker gerektirir.
        # ubuntu-latest runner'da Docker zaten kurulu olduğu için ekstra bir
        # servis tanımına gerek yoktur.

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cart-test-results
          path: cart/target/surefire-reports/**/*.xml
          retention-days: 7

      - name: Upload build artifact (jar)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cart-service-jar
          path: cart/target/*.jar
          retention-days: 7