server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # remoteEntry.js cache'lenirse shell eski sürümü yükler — her zaman taze.
    location = /assets/remoteEntry.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Federation asset'leri (content-hash'li chunk/CSS/görsel) shell'den cross-origin
    # çekilir ve build başına bir kez üretilir — uzun ömürlü, immutable cache.
    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # SPA fallback — standalone dev/preview için.
    location / {
        try_files $uri $uri/ /index.html;
    }
}