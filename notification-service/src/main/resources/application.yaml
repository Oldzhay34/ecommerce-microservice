spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # schema.sql, Postgres $$ dolar-quote fonksiyon govdeleri icerir; varsayilan tek
      # ';' ayiricisi govde icindeki ';' karakterlerinde de bolerdi (bkz. schema.sql
      # ust yorumu). Ozel iki-karakterli ayirici kullanilir.
      separator: ";;"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # Auto-configured Retry Mekanizması (Builder yerine eklendi)
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
          max-retries: 3
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

rabbitmq:
  exchange:
    topic: ecommerce.topic
  queue:
    otp: notification.email.otp.queue
    otp-dlq: notification.email.otp.dlq
  routing-key:
    otp: auth.event.otp