server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: cart-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cart_db}
    username: ${DB_USER:cart_user}
    password: ${DB_PASS:cart_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Dev/Test ortamı için tabloları otomatik oluşturur/günceller
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    # Hibernate once tabloları oluşturur/günceller, SONRA güvenlik trigger'ları
    # yazılır (aksi halde trigger script'i henüz var olmayan tablolara başvururdu).
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/security-triggers.sql

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Şifre varsa: password: ${REDIS_PASS}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-interval: 10s
          max-retries: 3

jwt:
  # Base64 ile encode edilmiş, en az 256-bit (32 karakter) uzunluğunda güvenli bir anahtar olmalıdır.
  secret: ${JWT_SECRET:EcommerceSharedJwtSecretKey2026VeryLongAndSecure32Bytes}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.amqp: INFO
    com.cart: DEBUG