server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # Hibernate once tabloları oluşturur/günceller, SONRA güvenlik trigger'ları
    # yazılır (aksi halde trigger script'i henüz var olmayan tablolara başvururdu).
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/security-triggers.sql
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

payment:
  gateway:
    provider: dev

iyzico:
  api-key: ""
  secret-key: ""

jwt:
  secret: "EcommerceSharedJwtSecretKey2026VeryLongAndSecure32Bytes"
  expiration: 3600000