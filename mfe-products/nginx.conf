server {
    listen 6005;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # GZIP Sıkıştırma (Performans için)
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    location / {
        # React Router (SPA) için fallback: Sayfa bulunamazsa index.html'e yönlendir
        try_files $uri $uri/ /index.html;

        # MİKRO-FRONTEND İÇİN HAYATİ: CORS AYARLARI
        # Host uygulamanın (örn: 3000 veya 3001) remoteEntry.js dosyasını çekebilmesi için
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # remoteEntry.js cache'lenmemeli — aşağıdaki genel kurala göre önceliklidir (exact match).
    location = /assets/remoteEntry.js {
        add_header Cache-Control "no-cache" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Statik dosyalar (js, css, görseller) için önbellekleme
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";

        # Statik assetler için de CORS izni şart
        add_header 'Access-Control-Allow-Origin' '*' always;
    }
}