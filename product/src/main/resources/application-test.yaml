spring:
  docker:
    compose:
      enabled: false

  # H2 In-Memory Veritabanı
  datasource:
    url: jdbc:h2:mem:producttestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Dummy bağlantı bilgileri (auto-config patlamasın diye)
  rabbitmq:
    host: localhost
  data:
    redis:
      host: localhost
  elasticsearch:
    uris: http://localhost:9200

# Actuator Health Check'leri test ortamında dış servislere ping atmasını engeller
management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
    elasticsearch:
      enabled: false

app:
  security:
    jwt-secret: "test-super-secret-key-that-is-very-long-for-hmac-sha256-256bit"