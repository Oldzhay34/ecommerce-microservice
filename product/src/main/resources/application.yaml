server:
  port: 8083

spring:
  application:
    name: product-service

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6432}/${DB_NAME:ecommerce_db}
    username: ${DB_USER:dev_user}
    password: ${DB_PASS:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Hibernate once tablolari olusturur/gunceller, SONRA guvenlik trigger'lari
    # yazilir (aksi halde trigger script'i henuz var olmayan tablolara basvururdu).
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/security-triggers.sql
      # security-triggers.sql $$ dolar-quote fonksiyon govdeleri icerir; varsayilan
      # tek ';' ayiricisi govde icindeki ';' karakterlerinde de bolerdi.
      separator: ";;"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}

app:
  security:
    jwt-secret: "EcommerceSharedJwtSecretKey2026VeryLongAndSecure32Bytes"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true