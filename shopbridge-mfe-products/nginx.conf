server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # remoteEntry.js ve tüm asset'ler için CORS (shell farklı origin'den yükler)
    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        # remoteEntry.js cache'lenmemeli (her deploy'da güncel yüklensin)
        location = /assets/remoteEntry.js {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }

        # diğer hash'li asset'ler uzun cache'lenebilir
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}