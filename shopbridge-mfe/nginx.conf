server {
    listen 5001;
    server_name localhost;
    root /usr/share/nginx/html;

    # remoteEntry.js her zaman taze olmalı — cache'lenirse shell yeni build'i göremez.
    location = /assets/remoteEntry.js {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Cache-Control' 'no-cache' always;
        try_files $uri =404;
    }

    # Content-hash'li diğer JS/CSS/asset'ler değişmez — CDN önden eklendiğinde
    # aynı davranışı bu origin zaten sağlar.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Cache-Control' 'public, max-age=31536000, immutable' always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header 'Cache-Control' 'no-cache, must-revalidate' always;
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Shell uygulamasının remoteEntry.js ve diğer chunk'ları çekebilmesi için CORS
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    }
}
