spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/security-triggers.sql
      # security-triggers.sql $$ dolar-quote fonksiyon govdeleri icerir; varsayilan
      # tek ';' ayiricisi govde icindeki ';' karakterlerinde de bolerdi.
      separator: ";;"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

app:
  security:
    jwt-secret: ${JWT_SECRET_KEY}
    aes-secret: ${AES_SECRET_KEY}