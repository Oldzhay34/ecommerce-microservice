spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:6432/ecommerce_db?sslmode=disable
    username: dev_user
    password: dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Hibernate once tablolari olusturur, SONRA guvenlik trigger'lari yazilir (aksi
    # halde trigger script'i henuz var olmayan tablolara basvururdu).
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/security-triggers.sql
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  security:
    jwt-secret: "dev-super-secret-key-that-is-very-long-for-hmac-sha256"
    aes-secret: "12345678901234567890123456789012"