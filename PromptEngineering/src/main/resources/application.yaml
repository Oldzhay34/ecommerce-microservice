spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8082

security:
  jwt:
    issuer: "ecommerce-auth"

# NOT: compose.yml SPRING_PROFILES_ACTIVE=docker aktif ediyor ama application-docker.yaml
# dosyası hiç mevcut değil — bu yüzden app.security.aes-secret eşlemesi (önceden sadece
# application-prod.yaml'da vardı) hiçbir zaman devreye girmiyor ve container "docker"
# profiliyle her başlatıldığında AesEncryptionConverter bean'i PlaceholderResolutionException
# ile çöküyordu. Base dosyaya taşındı: hangi profil aktif olursa olsun her zaman uygulanır.
app:
  security:
    aes-secret: ${AES_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true