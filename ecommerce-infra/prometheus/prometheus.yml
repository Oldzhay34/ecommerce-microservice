global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- API Gateway (Spring Cloud Gateway, WebFlux) ---
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          service: 'api-gateway'

  # --- Auth (PromptEngineering) ---
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['promptengineering-auth-service-1:8082']
        labels:
          service: 'auth-service'

  # --- Cart ---
  - job_name: 'cart-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['cart_service:8080']
        labels:
          service: 'cart-service'

  # --- Order ---
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8081']
        labels:
          service: 'order-service'

  # --- Payment ---
  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-payment-service-1:8084']
        labels:
          service: 'payment-service'

  # --- Product ---
  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['product-product-service-1:8083']
        labels:
          service: 'product-service'

  # --- Review ---
  - job_name: 'review-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['review-review-service-1:8084']
        labels:
          service: 'review-service'

  # --- Media (cloud storage) ---
  - job_name: 'media-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['media-service:8086']
        labels:
          service: 'media-service'

  # --- Notification (SMTP) — web-application-type: none,
  # metrikler ayrı bir management port'ta (8090) sunulur ---
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8090']
        labels:
          service: 'notification-service'

  # --- RabbitMQ (yerleşik Prometheus plugin'i etkinleştirilirse) ---
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['ecommerce-rabbitmq:15692']
        labels:
          service: 'rabbitmq'

  # --- Prometheus'un kendi kendini izlemesi ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
