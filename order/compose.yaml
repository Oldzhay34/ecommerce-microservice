services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres-order
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    networks:
      - ecommerce-shared-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=orderdb
      - DB_USER=postgres
      - DB_PASS=postgres
      - ES_URL=http://ecommerce-elasticsearch:9200
      - ES_INDEX_PREFIX=order
      - RABBITMQ_HOST=ecommerce-rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=ecommerce_admin
      - RABBITMQ_PASS=EcommerceSecurePass2026!
      - REDIS_HOST=ecommerce-redis
      - REDIS_PORT=6379
      - REDIS_DATABASE=2
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.modulith.events.amqp.RabbitJackson2Configuration
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-shared-network

volumes:
  postgres_data:

networks:
  ecommerce-shared-network:
    external: true