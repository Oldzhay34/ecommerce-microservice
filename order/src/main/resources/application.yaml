server:
  port: 8084

spring:

  application:
    name: order-service

  main:
    allow-bean-definition-overriding: true

  autoconfigure:
    exclude:
      # spring-modulith-events-amqp classpath'te hem Jackson 2 (com.fasterxml.jackson,
      # jjwt-jackson + uygulama kodu bunu kullanir) hem Jackson 3 (tools.jackson,
      # spring-data-elasticsearch/co.elastic.clients bunu gerektirir) gorunce IKI
      # ayri auto-configuration ile ayni 'rabbitTemplateCustomizer' bean'ini kaydediyor
      # (RabbitJackson2Configuration + RabbitJacksonConfiguration) ve context patliyor.
      # Jackson 3 tabanli olani disarida birakiyoruz; Jackson 2 tabanli olan aktif kalir.
      - org.springframework.modulith.events.amqp.RabbitJacksonConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Dev/Test ortamı için tabloları otomatik günceller
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    # Hibernate once tabloları oluşturur/günceller, SONRA güvenlik trigger'ları
    # yazılır (aksi halde trigger script'i henüz var olmayan tablolara başvururdu).
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/security-triggers.sql

  elasticsearch:
    uris: ${ES_URL:http://localhost:9200}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        default-requeue-rejected: false # Hata durumunda sonsuz döngüyü engeller