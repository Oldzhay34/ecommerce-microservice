server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Genel dosyalar ve routing için (React Router kullanılıyorsa try_files önemlidir)
    location / {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        try_files $uri $uri/ /index.html;
    }

    # remoteEntry.js her zaman taze olmalı — cache'lenirse shell yeni build'i göremez.
    location = /assets/remoteEntry.js {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Cache-Control' 'no-cache' always;
    }

    # Content-hash'li diğer JS/CSS dosyaları değişmez — uzun ömürlü, immutable cache.
    location ~ \.(js|mjs|css)$ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Cache-Control' 'public, max-age=31536000, immutable' always;
        types {
            application/javascript js mjs;
            text/css css;
        }
    }

    location = /index.html {
        add_header 'Cache-Control' 'no-cache, must-revalidate' always;
    }
}